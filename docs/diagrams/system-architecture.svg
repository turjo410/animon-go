<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="480" fill="#fbfaf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b332e">Animon GO — System Architecture</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/>
    </marker>
  </defs>

  <!-- Column 1: Mobile App -->
  <g>
    <rect x="20" y="70" width="260" height="360" rx="10" fill="#eef4ee" stroke="#4f8a5b" stroke-width="2"/>
    <text x="150" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#2b4a31">Mobile App</text>
    <text x="150" y="116" text-anchor="middle" font-size="12" fill="#4a5a4e">Flutter — iOS + Android</text>

    <rect x="40" y="140" width="220" height="60" rx="6" fill="#ffffff" stroke="#89a890"/>
    <text x="150" y="174" text-anchor="middle" font-size="13" fill="#2b332e">Camera Capture</text>

    <rect x="40" y="215" width="220" height="60" rx="6" fill="#ffffff" stroke="#89a890"/>
    <text x="150" y="240" text-anchor="middle" font-size="13" fill="#2b332e">Roster / Squad /</text>
    <text x="150" y="257" text-anchor="middle" font-size="13" fill="#2b332e">Battle UI</text>

    <rect x="40" y="290" width="220" height="60" rx="6" fill="#ffffff" stroke="#89a890"/>
    <text x="150" y="324" text-anchor="middle" font-size="13" fill="#2b332e">Local Cache</text>
  </g>

  <!-- Column 2: Supabase Backend -->
  <g>
    <rect x="330" y="70" width="260" height="360" rx="10" fill="#eaf1f6" stroke="#3f7ea6" stroke-width="2"/>
    <text x="460" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1f425a">Supabase Backend</text>
    <text x="460" y="116" text-anchor="middle" font-size="12" fill="#3a5568">authoritative player state</text>

    <rect x="350" y="140" width="220" height="55" rx="6" fill="#ffffff" stroke="#7fa8c2"/>
    <text x="460" y="172" text-anchor="middle" font-size="13" fill="#2b332e">Auth</text>

    <rect x="350" y="210" width="220" height="80" rx="6" fill="#ffffff" stroke="#7fa8c2"/>
    <text x="460" y="240" text-anchor="middle" font-size="13" fill="#2b332e">Postgres</text>
    <text x="460" y="258" text-anchor="middle" font-size="11.5" fill="#4a5a4e">players · companions · claims</text>

    <rect x="350" y="305" width="220" height="55" rx="6" fill="#ffffff" stroke="#7fa8c2"/>
    <text x="460" y="337" text-anchor="middle" font-size="13" fill="#2b332e">Edge Functions</text>
  </g>

  <!-- Column 3: Identity Provider Boundary -->
  <g>
    <rect x="640" y="70" width="260" height="360" rx="10" fill="#f6efe6" stroke="#b98b3f" stroke-width="2"/>
    <text x="770" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#5a4320">Identity Provider Boundary</text>
    <text x="770" y="116" text-anchor="middle" font-size="11.5" fill="#6b5a3c">used only by the identity pilot</text>

    <rect x="660" y="150" width="220" height="70" rx="6" fill="#ffffff" stroke="#cba05c"/>
    <text x="770" y="182" text-anchor="middle" font-size="13" fill="#2b332e">Mock Provider</text>
    <text x="770" y="199" text-anchor="middle" font-size="11" fill="#6b5a3c">always available</text>

    <rect x="660" y="240" width="220" height="70" rx="6" fill="#ffffff" stroke="#cba05c"/>
    <text x="770" y="272" text-anchor="middle" font-size="13" fill="#2b332e">Petify (live)</text>
    <text x="770" y="289" text-anchor="middle" font-size="11" fill="#6b5a3c">cats / dogs only, pilot-gated</text>
  </g>

  <!-- Arrows -->
  <line x1="280" y1="250" x2="330" y2="250" stroke="#5b6b63" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="305" y="238" text-anchor="middle" font-size="11" fill="#2b332e">sync /</text>
  <text x="305" y="270" text-anchor="middle" font-size="11" fill="#2b332e">auth</text>

  <line x1="590" y1="250" x2="640" y2="250" stroke="#5b6b63" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="238" text-anchor="middle" font-size="10.5" fill="#2b332e">server-to-</text>
  <text x="615" y="270" text-anchor="middle" font-size="10.5" fill="#2b332e">server only</text>

  <text x="460" y="460" text-anchor="middle" font-size="11.5" fill="#6a6a6a">Mobile product: apps/mobile + Supabase. Identity pilot (animon-identity-pilot) is a separate, bounded sub-project.</text>
</svg>
