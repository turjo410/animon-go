<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="540" fill="#fbfaf7"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b332e">Animon GO — Core Game Loop</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/>
    </marker>
  </defs>

  <!-- Loop connector lines (drawn first, boxes cover the ends) -->
  <g stroke="#5b6b63" stroke-width="2" marker-end="url(#arrow2)" fill="none">
    <line x1="151.5" y1="388.5" x2="114.75" y2="227.7"/>   <!-- Discover -> Classify -->
    <line x1="114.75" y1="227.7" x2="217.6" y2="98.8"/>    <!-- Classify -> Awaken -->
    <line x1="217.6" y1="98.8" x2="382.4" y2="98.8"/>      <!-- Awaken -> Collect -->
    <line x1="382.4" y1="98.8" x2="485.25" y2="227.7"/>    <!-- Collect -> Bond/Train -->
    <line x1="485.25" y1="227.7" x2="448.5" y2="388.5"/>   <!-- Bond/Train -> Squad -->
    <line x1="448.5" y1="388.5" x2="300" y2="460"/>        <!-- Squad -> Battle -->
    <path d="M 230,460 C 90,470 58,392 115,395"/>          <!-- Battle -> back to Discover -->
  </g>

  <!-- Nodes -->
  <g font-size="14" fill="#2b332e" text-anchor="middle">
    <g>
      <rect x="81.5" y="360.5" width="140" height="56" rx="10" fill="#eef4ee" stroke="#4f8a5b" stroke-width="2"/>
      <text x="151.5" y="393.5" font-weight="700">1. Discover</text>
    </g>
    <g>
      <rect x="44.75" y="199.7" width="140" height="56" rx="10" fill="#eef4ee" stroke="#4f8a5b" stroke-width="2"/>
      <text x="114.75" y="232.7" font-weight="700">2. Classify</text>
    </g>
    <g>
      <rect x="147.6" y="70.8" width="140" height="56" rx="10" fill="#eef4ee" stroke="#4f8a5b" stroke-width="2"/>
      <text x="217.6" y="103.8" font-weight="700">3. Awaken</text>
    </g>
    <g>
      <rect x="312.4" y="70.8" width="140" height="56" rx="10" fill="#eaf1f6" stroke="#3f7ea6" stroke-width="2"/>
      <text x="382.4" y="103.8" font-weight="700">4. Collect</text>
    </g>
    <g>
      <rect x="415.25" y="199.7" width="140" height="56" rx="10" fill="#eaf1f6" stroke="#3f7ea6" stroke-width="2"/>
      <text x="485.25" y="226.7" font-weight="700">5. Bond /</text>
      <text x="485.25" y="243.7" font-weight="700">Train</text>
    </g>
    <g>
      <rect x="378.5" y="360.5" width="140" height="56" rx="10" fill="#eaf1f6" stroke="#3f7ea6" stroke-width="2"/>
      <text x="448.5" y="393.5" font-weight="700">6. Squad</text>
    </g>
    <g>
      <rect x="230" y="432" width="140" height="56" rx="10" fill="#f6efe6" stroke="#b98b3f" stroke-width="2"/>
      <text x="300" y="465" font-weight="700">7. Battle</text>
    </g>
  </g>

  <!-- Reward side note -->
  <line x1="370" y1="460" x2="598" y2="460" stroke="#8a7a52" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <rect x="600" y="432" width="160" height="56" rx="10" fill="#fff8ea" stroke="#b98b3f" stroke-width="2"/>
  <text x="680" y="456" text-anchor="middle" font-size="13" fill="#5a4320" font-weight="700">Reward</text>
  <text x="680" y="474" text-anchor="middle" font-size="12" fill="#5a4320">essence + XP</text>

  <text x="390" y="515" text-anchor="middle" font-size="11.5" fill="#6a6a6a">A cleared wave repeats the loop; a confident discovery either adds a new companion or reinforces familiarity.</text>
</svg>
