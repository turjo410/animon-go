[project]
name = "animon-model-eval"
version = "0.1.0"
description = "Offline evaluation harness for Animon GO model candidates (family classification + individual identity). Research tooling only; nothing here ships in the app."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.3",
    "transformers>=4.49",
    "timm>=1.0.9",
    "pillow>=10.0",
    "pillow-heif>=0.18",  # iPhone photos default to HEIC
    "numpy>=1.26",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]

[project.optional-dependencies]
# Only needed to regenerate imagenet_family_map.json (already committed).
wordnet = ["nltk>=3.8"]
# Notebooks that explain the results with charts (notebooks/).
notebook = ["jupyterlab>=4.2", "matplotlib>=3.8"]
# Local demo website: app/animal_id_app.py
app = ["streamlit>=1.40"]

[tool.uv]
package = false
